<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>세포 방범대 · MGOFF</title>
<style>
  :root { --bg:#fbfaf7; --text:#1f2328; --muted:#5b6370; --line:#e3e0d8; --accent:#b4232f; --card:#ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181c; --text:#e8e6e1; --muted:#a3a9b3; --line:#2c3038; --accent:#ff7a84; --card:#1d2026; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; line-height:1.75; word-break:keep-all; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  .brand { font-size:14px; color:var(--accent); font-weight:700; letter-spacing:.02em; }
  h1 { font-size:26px; margin:4px 0 8px; line-height:1.35; }
  .meta { color:var(--muted); font-size:14px; margin:0 0 24px; }
  h2 { font-size:18px; margin:36px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
  p, li { font-size:15.5px; }
  ul, ol { padding-left:22px; }
  .table-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:14.5px; margin:8px 0; background:var(--card); }
  th, td { border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top; }
  th { background:color-mix(in srgb, var(--line) 45%, transparent); white-space:nowrap; }
  a { color:var(--accent); }
  .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .box p { margin:0; } .box p + p { margin-top:8px; }
  footer { margin-top:48px; color:var(--muted); font-size:13.5px; }
</style>
</head>

<main>
  <div class="brand">MGOFF</div>
  <h1>세포 방범대</h1>
  <p class="meta">면역세포가 몸속으로 들어온 병원체를 막아 내는 세로형 타워 디펜스 · 방치 게임</p>

  <div class="box">
    <p>호흡기, 소화기, 피부, 간, 구강까지 우리 몸 곳곳을 지키는 면역세포 방범대를 꾸려 보세요. 병원체를 막아 낸 기억은 쉬는 동안에도 보상이 되어 돌아옵니다.</p>
  </div>
